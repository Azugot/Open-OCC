# Isolated synthetic verification stack: no user data or paid providers.
services:
  frontend:
    ports: !override
      - "127.0.0.1:8082:80"
  backend:
    environment:
      APP_ACCESS_TOKEN: ""
      DEEPSEEK_BASE_URL: http://import-model:23306/v1
      DEEPSEEK_API_KEY: synthetic-test
      DEEPSEEK_DEFAULT_MODEL: scripted
      NARRATION_PROVIDER: fixture
      RECONSTRUCTION_PROVIDER: deepseek
      MEMORY_PROVIDER: fixture
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      KIMI_API_KEY: ""
      CHARACTER_API_KEY: ""
      DIRECTOR_API_KEY: ""
  import-model:
    image: node:22-alpine
    working_dir: /fixtures
    command: ["node", "import-model.mjs"]
    volumes:
      - ./tests/import-model.mjs:/fixtures/import-model.mjs:ro
