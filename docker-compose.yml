services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=${POSTGRES_DB:-storyapp};Username=${POSTGRES_USER:-storyapp};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
      ANTHROPIC_DEFAULT_MODEL: ${ANTHROPIC_DEFAULT_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_DEFAULT_MODEL: ${DEEPSEEK_DEFAULT_MODEL:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-}
      KIMI_DEFAULT_MODEL: ${KIMI_DEFAULT_MODEL:-}
      LEMONADE_BASE_URL: ${LEMONADE_BASE_URL:-http://host.docker.internal:13305/v1}
      LEMONADE_API_KEY: ${LEMONADE_API_KEY:-}
      LEMONADE_DEFAULT_MODEL: ${LEMONADE_DEFAULT_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-}
      NARRATION_PROVIDER: ${NARRATION_PROVIDER:-fixture}
      NARRATION_MODEL: ${NARRATION_MODEL:-fixture-v1}
      CHARACTER_PROVIDER: ${CHARACTER_PROVIDER:-character}
      DIRECTOR_PROVIDER: ${DIRECTOR_PROVIDER:-director}
      CHARACTER_ADAPTER: ${CHARACTER_ADAPTER:-fixture}
      DIRECTOR_ADAPTER: ${DIRECTOR_ADAPTER:-fixture}
      CHARACTER_MODEL: ${CHARACTER_MODEL:-fixture-v1}
      DIRECTOR_MODEL: ${DIRECTOR_MODEL:-fixture-v1}
      CHARACTER_API_KEY: ${CHARACTER_API_KEY:-}
      DIRECTOR_API_KEY: ${DIRECTOR_API_KEY:-}
      CHARACTER_BASE_URL: ${CHARACTER_BASE_URL:-}
      DIRECTOR_BASE_URL: ${DIRECTOR_BASE_URL:-}
      RECONSTRUCTION_PROVIDER: ${RECONSTRUCTION_PROVIDER:-fixture}
      MEMORY_PROVIDER: ${MEMORY_PROVIDER:-fixture}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storyapp}
      POSTGRES_USER: ${POSTGRES_USER:-storyapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres-data:
